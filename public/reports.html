<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Saved Reports</title>
  <style>
    body { font-family: -apple-system, Segoe UI, Roboto, sans-serif; background: #f4f5f7; margin: 0; padding: 24px; color: #1f2933; }
    .card { max-width: 860px; margin: 0 auto; background: #fff; border-radius: 8px; box-shadow: 0 1px 4px rgba(0,0,0,.1); padding: 28px; }
    h1 { margin-top: 0; }
    table { width: 100%; border-collapse: collapse; margin-top: 12px; }
    th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid #e4e7eb; font-size: 14px; }
    th { background: #f8fafc; }
    tr:last-child td { border-bottom: 0; }
    a { color: #2563eb; text-decoration: none; }
    a.btn { font-size: 12px; margin-right: 8px; white-space: nowrap; }
    .empty { color: #64748b; margin-top: 12px; }
    a.top { display: inline-block; margin-top: 18px; font-size: 13px; }
  </style>
</head>
<body>
  <div class="card">
    <h1>Saved Reports</h1>
    <table>
      <thead><tr><th>Date</th><th>Name</th><th>Period</th><th>Actions</th></tr></thead>
      <tbody id="rows"></tbody>
    </table>
    <div id="empty" class="empty" style="display:none">No reports yet.</div>
    <a class="top" href="/">← Back to form</a>
  </div>

  <script>
    let token = sessionStorage.getItem('access_token') || '';
    function headers() {
      const h = {};
      if (token) h['Authorization'] = 'Bearer ' + token;
      return h;
    }

    async function load() {
      const auth = await fetch('/config/supabase');
      if (auth.ok && !token) { window.location.href = '/login.html'; return; }
      const res = await fetch('/api/reports', { headers: headers() });
      const reports = await res.json();
      const tbody = document.getElementById('rows');
      tbody.innerHTML = '';
      if (!reports.length) {
        document.getElementById('empty').style.display = 'block';
        return;
      }
      const cfg = await (await fetch('/api/config')).json();
      const nameField = cfg.fields.find((f) => /name/i.test(f.name + f.label));
      const periodField = cfg.fields.find((f) => /period/i.test(f.name + f.label));
      reports.forEach((r) => {
        const tr = document.createElement('tr');
        const vals = r.form_values || {};
        tr.innerHTML = `
          <td>${new Date(r.createdAt).toLocaleString()}</td>
          <td>${escapeHtml(nameField ? vals[nameField.name] || '—' : '—')}</td>
          <td>${escapeHtml(periodField ? vals[periodField.name] || '—' : '—')}</td>
          <td>
            <a class="btn" href="#" onclick="dl('${r.id}','docx');return false;">DOCX</a>
            <a class="btn" href="#" onclick="dl('${r.id}','pdf');return false;">PDF</a>
          </td>`;
        tbody.appendChild(tr);
      });
    }
    function escapeHtml(v) {
      return String(v == null ? '' : v).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    }

    async function dl(id, format) {
      const res = await fetch(`/api/reports/${id}/download?format=${format}`, { headers: headers() });
      if (!res.ok) { alert('Download failed'); return; }
      const blob = await res.blob();
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = 'report-' + id + '.' + format;
      document.body.appendChild(a);
      a.click();
      a.remove();
      URL.revokeObjectURL(a.href);
    }

    load();
  </script>
</body>
</html>
