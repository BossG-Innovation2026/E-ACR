<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign in — Accomplishment Report</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    body { font-family: -apple-system, Segoe UI, Roboto, sans-serif; background: #f4f5f7; margin: 0; padding: 24px; color: #1f2933; }
    .card { max-width: 360px; margin: 60px auto; background: #fff; border-radius: 8px; box-shadow: 0 1px 4px rgba(0,0,0,.1); padding: 28px; }
    h1 { margin-top: 0; font-size: 22px; }
    .field { margin-bottom: 14px; }
    label { display: block; font-weight: 600; margin-bottom: 6px; font-size: 14px; }
    input { width: 100%; box-sizing: border-box; padding: 8px 10px; border: 1px solid #cbd2d9; border-radius: 6px; font: inherit; }
    button { width: 100%; padding: 10px; border: 0; border-radius: 6px; background: #2563eb; color: #fff; font: inherit; cursor: pointer; }
    button.secondary { background: #64748b; margin-top: 8px; }
    .msg { margin-top: 12px; font-weight: 500; }
    .msg.err { color: #c0392b; }
    .msg.ok { color: #15803d; }
    .hint { font-size: 12px; color: #64748b; margin-top: 14px; }
  </style>
</head>
<body>
  <div class="card">
    <h1>Sign in</h1>
    <div class="field"><label for="email">Email</label><input id="email" type="email" /></div>
    <div class="field"><label for="password">Password</label><input id="password" type="password" /></div>
    <button id="signin">Sign in</button>
    <button id="signup" class="secondary">Create account</button>
    <div id="msg" class="msg"></div>
    <div class="hint">Accounts are managed by your Supabase project (Email auth).</div>
  </div>

  <script>
    let supabase = null;

    async function init() {
      const res = await fetch('/config/supabase');
      if (!res.ok) { showMsg('Supabase is not configured on the server.', true); return; }
      const cfg = await res.json();
      supabase = window.supabase.createClient(cfg.url, cfg.anonKey);
      const { data, error } = await supabase.auth.getUser();
      if (data && data.user && !error) {
        sessionStorage.setItem('access_token', data.session.access_token);
        window.location.href = '/index.html';
      }
    }

    function showMsg(text, isError) {
      const msg = document.getElementById('msg');
      msg.textContent = text;
      msg.className = 'msg ' + (isError ? 'err' : 'ok');
    }

    document.getElementById('signin').addEventListener('click', async () => {
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      const { data, error } = await supabase.auth.signInWithPassword({ email, password });
      if (error) return showMsg(error.message, true);
      sessionStorage.setItem('access_token', data.session.access_token);
      window.location.href = '/index.html';
    });

    document.getElementById('signup').addEventListener('click', async () => {
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      const { data, error } = await supabase.auth.signUp({ email, password });
      if (error) return showMsg(error.message, true);
      showMsg(data.session ? 'Account created.' : 'Check your email to confirm, then sign in.');
    });

    init();
  </script>
</body>
</html>
